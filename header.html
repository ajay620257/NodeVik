/* ===== Dropdown ===== */
.dropdown-menu {
  list-style: none;
  position: absolute;
  top: 100%;
  left: 0;
  background: linear-gradient(45deg,#ff4b2b,#ff4b2b);
  min-width: 200px;
  border-radius: 6px;
  overflow: hidden;
  max-height: 0;
  opacity: 0;
  transition: all .3s ease;
  z-index: 999;
}

.dropdown:hover .dropdown-menu {
  max-height: 500px;
  opacity: 1;
}

.dropdown-menu li a {

}
.dropdown-menu li a:hover {
  background: rgba(255, 255, 255, 0.2);

}

/* ===== Hamburger Toggle ===== */
#menu-toggle {

}
.menu-icon {

}
.menu-icon span {
  width: 25px;
  height: 3px;
  background: #fff;
  transition: .3s;
}

/* ===== Responsive ===== */
@media (max-width: 768px) {
  .menu-icon { display: flex; }

    top: 60px;
    left: 0;
    width: 100%;
    flex-direction: column;

    max-height: 0;
    overflow: hidden;
    transition: max-height .3s ease;
  }

  /* menu toggle working */
  #menu-toggle:checked + .menu-icon + .nav-menu {
    max-height: 600px;
  }

  .dropdown-menu {
    position: static;
    background: rgba(0,0,0,0.1);
    max-height: none;
    opacity: 1;
    display: none;
  }
  .dropdown:hover .dropdown-menu {
    display: block;
  }
}
